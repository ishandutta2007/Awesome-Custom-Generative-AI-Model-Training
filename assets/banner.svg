<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#140b29" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      .desc-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Animated Elements in Background */
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -25px) scale(1.15); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 30px) scale(1.1); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulseBeam {
        0%, 100% { stroke-dashoffset: 600; opacity: 0.2; }
        50% { stroke-dashoffset: 0; opacity: 0.8; }
      }
      @keyframes orbitWave {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .floating-orb-1 {
        animation: floatSlow1 10s ease-in-out infinite;
      }
      .floating-orb-2 {
        animation: floatSlow2 12s ease-in-out infinite;
      }
      .beam-line {
        stroke-dasharray: 120 180;
        animation: pulseBeam 8s linear infinite;
      }
      .rotating-group {
        transform-origin: 980px 210px;
        animation: orbitWave 30s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Backdrop -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Nebula Glows (Background layer) -->
  <g opacity="0.45">
    <circle class="floating-orb-1" cx="220" cy="110" r="140" fill="#3b82f6" filter="url(#orbGlow)" />
    <circle class="floating-orb-2" cx="950" cy="280" r="160" fill="#a855f7" filter="url(#orbGlow)" />
    <circle class="floating-orb-1" cx="620" cy="350" r="120" fill="#ec4899" filter="url(#orbGlow)" />
  </g>

  <!-- Cyber Grid -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Network Circuit / Topology Behind Content -->
  <g opacity="0.35">
    <path class="beam-line" d="M 50 150 Q 250 80, 500 180 T 950 100 T 1150 250" fill="none" stroke="#60a5fa" stroke-width="2" />
    <path class="beam-line" d="M 100 350 Q 400 280, 700 340 T 1100 200" fill="none" stroke="#c084fc" stroke-width="2" style="animation-delay: -3s;" />
  </g>

  <!-- Decorative Orbit Nodes on the right side -->
  <g class="rotating-group" opacity="0.6">
    <circle cx="980" cy="210" r="120" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="980" cy="210" r="70" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" />
    <circle cx="1100" cy="210" r="7" fill="#60a5fa" filter="url(#glow)" />
    <circle cx="860" cy="210" r="5" fill="#f472b6" filter="url(#glow)" />
    <circle cx="980" cy="90" r="6" fill="#a855f7" filter="url(#glow)" />
    <circle cx="980" cy="330" r="5" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Foreground Content Container (Guaranteed Sharp Foreground) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill Tag -->
    <g transform="translate(0, 55)">
      <rect width="280" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(165, 180, 252, 0.3)" stroke-width="1" />
      <circle cx="18" cy="16" r="4" fill="#34d399" />
      <text x="32" y="21" class="pill-text" fill="#a5b4fc">CURATED REPO &amp; KNOWLEDGE HUB</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" fill="url(#textGrad)" filter="url(#glow)">Awesome-Custom-Generative-AI</text>

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle-text" fill="url(#subGrad)">Model Training, Fine-Tuning &amp; Adaptation Ecosystem</text>

    <!-- Summary / Tagline -->
    <text x="0" y="225" class="desc-text">LoRA • QLoRA • DreamBooth • Full Fine-Tuning • Diffusion &amp; LLM Alignment • PEFT • TRL</text>
    <text x="0" y="250" class="desc-text">Comprehensive landscape of premier enterprise SaaS platforms and leading open-source libraries</text>

    <!-- Feature Badges / Pills -->
    <g transform="translate(0, 290)">
      <!-- Pill 1: LLM Alignment -->
      <g transform="translate(0, 0)">
        <rect width="130" height="38" rx="10" fill="url(#pillGrad)" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1.2" />
        <text x="65" y="24" text-anchor="middle" class="pill-text">⚡ LLM Alignment</text>
      </g>
      
      <!-- Pill 2: Diffusion Tuning -->
      <g transform="translate(145, 0)">
        <rect width="145" height="38" rx="10" fill="url(#pillGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" />
        <text x="72" y="24" text-anchor="middle" class="pill-text">🎨 Diffusion Tuning</text>
      </g>

      <!-- Pill 3: LoRA & PEFT -->
      <g transform="translate(305, 0)">
        <rect width="125" height="38" rx="10" fill="url(#pillGrad)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.2" />
        <text x="62" y="24" text-anchor="middle" class="pill-text">🔬 LoRA / PEFT</text>
      </g>

      <!-- Pill 4: Enterprise SaaS -->
      <g transform="translate(445, 0)">
        <rect width="140" height="38" rx="10" fill="url(#pillGrad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" />
        <text x="70" y="24" text-anchor="middle" class="pill-text">☁️ Enterprise SaaS</text>
      </g>

      <!-- Pill 5: Open-Source -->
      <g transform="translate(600, 0)">
        <rect width="130" height="38" rx="10" fill="url(#pillGrad)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.2" />
        <text x="65" y="24" text-anchor="middle" class="pill-text">💻 Open Source</text>
      </g>
    </g>

    <!-- Bottom border flourish -->
    <line x1="0" y1="365" x2="1040" y2="365" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  </g>
</svg>
