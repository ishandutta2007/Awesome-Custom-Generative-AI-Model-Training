<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="50%" stop-color="#0d1124"/><stop offset="100%" stop-color="#140b29"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="orbGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="40"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-25px) scale(1.15)}}@keyframes floatSlow2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-35px,30px) scale(1.1)}}@keyframes pulseBeam{0%{stroke-dashoffset:600;opacity:.2}50%{stroke-dashoffset:0;opacity:.8}}@keyframes orbitWave{0%{transform:rotate(0deg)}}.title-text{font-weight:800;font-size:44px;letter-spacing:-.5px}.desc-text,.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:600;font-size:20px;letter-spacing:.5px}.desc-text{font-weight:400;font-size:15px;fill:#94a3b8}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}.floating-orb-1{animation:floatSlow1 10s ease-in-out infinite}.floating-orb-2{animation:floatSlow2 12s ease-in-out infinite}.beam-line{stroke-dasharray:120 180;animation:pulseBeam 8s linear infinite}.rotating-group{transform-origin:980px 210px;animation:orbitWave 30s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)"/><g opacity=".45"><circle cx="220" cy="110" r="140" fill="#3b82f6" class="floating-orb-1" filter="url(#orbGlow)"/><circle cx="950" cy="280" r="160" fill="#a855f7" class="floating-orb-2" filter="url(#orbGlow)"/><circle cx="620" cy="350" r="120" fill="#ec4899" class="floating-orb-1" filter="url(#orbGlow)"/></g><rect width="1200" height="420" fill="url(#grid)"/><g opacity=".35"><path fill="none" stroke="#60a5fa" stroke-width="2" d="M 50 150 Q 250 80, 500 180 T 950 100 T 1150 250" class="beam-line"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 100 350 Q 400 280, 700 340 T 1100 200" class="beam-line" style="animation-delay:-3s"/></g><g class="rotating-group" opacity=".6"><circle cx="980" cy="210" r="120" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="6 6" stroke-width="1.5"/><circle cx="980" cy="210" r="70" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1"/><circle cx="1100" cy="210" r="7" fill="#60a5fa" filter="url(#glow)"/><circle cx="860" cy="210" r="5" fill="#f472b6" filter="url(#glow)"/><circle cx="980" cy="90" r="6" fill="#a855f7" filter="url(#glow)"/><circle cx="980" cy="330" r="5" fill="#38bdf8" filter="url(#glow)"/></g><g transform="translate(80, 0)"><g transform="translate(0, 55)"><rect width="280" height="32" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(165, 180, 252, 0.3)" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="4" fill="#34d399"/><text x="32" y="21" fill="#a5b4fc" class="pill-text">CURATED REPO &amp; KNOWLEDGE HUB</text></g><text x="0" y="145" fill="url(#textGrad)" class="title-text" filter="url(#glow)">Awesome-Custom-Generative-AI</text><text x="0" y="190" fill="url(#subGrad)" class="subtitle-text">Model Training, Fine-Tuning &amp; Adaptation Ecosystem</text><text x="0" y="225" class="desc-text">LoRA • QLoRA • DreamBooth • Full Fine-Tuning • Diffusion &amp; LLM Alignment • PEFT • TRL</text><text x="0" y="250" class="desc-text">Comprehensive landscape of premier enterprise SaaS platforms and leading open-source libraries</text><g><g transform="translate(0, 290) translate(0, 0)"><rect width="130" height="38" fill="url(#pillGrad)" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1.2" rx="10"/><text x="65" y="24" class="pill-text" text-anchor="middle">⚡ LLM Alignment</text></g><g transform="translate(0, 290) translate(145, 0)"><rect width="145" height="38" fill="url(#pillGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.2" rx="10"/><text x="72" y="24" class="pill-text" text-anchor="middle">🎨 Diffusion Tuning</text></g><g transform="translate(0, 290) translate(305, 0)"><rect width="125" height="38" fill="url(#pillGrad)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.2" rx="10"/><text x="62" y="24" class="pill-text" text-anchor="middle">🔬 LoRA / PEFT</text></g><g transform="translate(0, 290) translate(445, 0)"><rect width="140" height="38" fill="url(#pillGrad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" rx="10"/><text x="70" y="24" class="pill-text" text-anchor="middle">☁️ Enterprise SaaS</text></g><g transform="translate(0, 290) translate(600, 0)"><rect width="130" height="38" fill="url(#pillGrad)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.2" rx="10"/><text x="65" y="24" class="pill-text" text-anchor="middle">💻 Open Source</text></g></g><line x1="0" x2="1040" y1="365" y2="365" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/></g></svg>